      - name: Java 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1 einrichten
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 35 bereitstellen
        shell: bash
        run: |
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Unabhaengige Warteschlangentests
        shell: bash
        run: |
          mkdir -p build/core-tests
          javac -d build/core-tests app/src/main/java/de/aura/player/QueueEngine.java core-tests/QueueEngineTest.java
          java -cp build/core-tests QueueEngineTest
      - name: Debug-APK bauen
        run: gradle --no-daemon :app:assembleDebug
      - name: Signatur pruefen und APK bereitstellen
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AURA.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/AURA.apk
          (cd dist && sha256sum AURA.apk > AURA.apk.sha256)
          printf '%s\n' 'AURA 0.1.0-preview: Debug-Testversion, kein gepruefter Produktionsrelease.' 'Originalmusik bleibt lokal. Android-Geraetetest ist erforderlich.' 'APK oeffnen und Systemhinweise beachten. Play Protect nicht pauschal deaktivieren.' 'Neue CI-Laeufe koennen abweichende Debug-Signaturen erzeugen.' > dist/BITTE-LESEN.txt
      - name: Installationspaket als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: AURA-APK
          path: dist/
          if-no-files-found: error
          retention-days: 14
